<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NER Annotator — tests</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --panel:#fff; --text:#16181d; --muted:#666d7a; --border:#dfe3e8; --ok:#15803d; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a21; --text:#e8eaed; --muted:#9aa3b2; --border:#2a2f3a; --ok:#4ade80; --bad:#f87171; }
  }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13.5px; margin-bottom:18px; }
  #summary { font-weight:650; padding:10px 14px; border-radius:10px; margin-bottom:14px; border:1px solid var(--border); background:var(--panel); }
  #summary.pass { border-left:4px solid var(--ok); }
  #summary.fail { border-left:4px solid var(--bad); }
  .group { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .group h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .t { font-family:ui-monospace,Consolas,monospace; font-size:13px; padding:2px 0; }
  .t.ok::before  { content:"PASS "; color:var(--ok); font-weight:700; }
  .t.bad::before { content:"FAIL "; color:var(--bad); font-weight:700; }
  .t .why { color:var(--bad); display:block; padding-left:46px; }
  .note { background:var(--panel); border:1px solid var(--border); border-left:4px solid #d97706;
          border-radius:10px; padding:14px; }
  code { background:rgba(127,127,127,.15); padding:1px 6px; border-radius:5px; font-size:13px; }
  iframe { position:fixed; width:1200px; height:900px; left:-3000px; top:0; border:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NER Annotator — test suite</h1>
  <div class="sub">Loads <code>../ner_annotator.html</code> in a hidden frame and exercises it for real: parsing, span
  arithmetic, rendering, export round trips and the keyboard path.</div>
  <div id="summary">Running…</div>
  <div id="results"></div>
</div>
<iframe id="app" src="../ner_annotator.html"></iframe>

<script>
(function () {
  "use strict";
  var results = document.getElementById("results");
  var summary = document.getElementById("summary");
  var passed = 0, failed = 0, group = null;

  function G(name) {
    group = document.createElement("div");
    group.className = "group";
    group.innerHTML = "<h2>" + name + "</h2>";
    results.appendChild(group);
  }
  function ok(name, cond, why) {
    var d = document.createElement("div");
    d.className = "t " + (cond ? "ok" : "bad");
    d.textContent = name;
    if (!cond && why !== undefined) {
      var s = document.createElement("span");
      s.className = "why";
      s.textContent = why;
      d.appendChild(s);
    }
    group.appendChild(d);
    cond ? passed++ : failed++;
  }
  function eq(name, a, b) {
    var sa = JSON.stringify(a), sb = JSON.stringify(b);
    ok(name, sa === sb, "got " + sa + "  want " + sb);
  }

  function fail(msg) {
    summary.className = "fail";
    summary.textContent = msg;
  }

  var frame = document.getElementById("app");

  // file:// blocks same-origin access into the frame, so say so plainly
  // instead of reporting a wall of false failures.
  function unreachable(e) {
    summary.className = "fail";
    summary.textContent = "Cannot reach the annotator inside the frame.";
    results.innerHTML =
      '<div class="note"><b>Serve this folder over http instead of opening it from disk.</b><br><br>' +
      "Browsers refuse cross-frame access between <code>file://</code> pages, so the tests cannot see the tool. " +
      "From the repo root run:<br><br><code>python -m http.server 8000</code><br><br>" +
      "then open <code>http://localhost:8000/Manual_Tagger/tests/test_annotator.html</code>.<br><br>" +
      "<span style=\"color:var(--muted)\">(" + e.message + ")</span></div>";
  }

  // The frame's load event can beat the app's own start-up, so wait for both
  // the core and the booted app rather than assuming they are there.
  function whenReady(tries) {
    var win;
    try {
      win = frame.contentWindow;
      if (!win) throw new Error("no window in the frame");
      if (!win.NER || !win.__NER_APP__) {
        if (tries < 150) { setTimeout(function () { whenReady(tries + 1); }, 20); return; }
        throw new Error("the annotator did not finish starting");
      }
    } catch (e) {
      unreachable(e);
      return;
    }
    start(win);
  }

  function start(win) {
    // The suite drives the real app, so it must not disturb the person running
    // it: autosave is switched off for the duration and the tag sets are put
    // back exactly as they were, whatever happens.
    var APP = win.__NER_APP__;
    var savedScheme = JSON.stringify({
      labels: APP.state.labels, sets: APP.state.tagSets, active: APP.state.activeSet
    });
    APP.state.storage = null;
    try {
      run(win, win.NER, APP);
    } catch (e) {
      if (!group) G("Suite");
      ok("suite ran to completion", false, e && e.stack ? e.stack : String(e));
    } finally {
      try {
        var s = JSON.parse(savedScheme);
        APP.state.labels = s.labels;
        APP.state.tagSets = s.sets;
        APP.state.activeSet = s.active;
        APP.saveScheme();
        APP.renderLabels();
      } catch (e2) { /* nothing worth failing the run over */ }
    }
    summary.className = failed ? "fail" : "pass";
    summary.textContent = failed
      ? failed + " failed, " + passed + " passed"
      : "All " + passed + " tests passed";
  }

  frame.onload = function () { whenReady(0); };

  // ------------------------------------------------------------------ tests
  function run(win, NER, APP) {
    var els = APP.els, doc = win.document;

    G("Parsing");
    var p = NER.parseDataset('[{"id":1,"text":"San Diego burns","Comments":[],"label":[[0,9,"GPE"]]}]');
    eq("plain JSON array", p.records.length, 1);
    eq("span preserved", p.records[0].label, [[0, 9, "GPE"]]);

    p = NER.parseDataset('{"id":1,"text":"a b"}\n{"id":2,"text":"c d"}');
    eq("JSONL detected without a hint", p.records.length, 2);

    p = NER.parseDataset(JSON.stringify({ labels: ["X"], examples: [{ id: 7, content: "hello world", entities: [{ start: 0, end: 5, label: "X" }] }] }));
    eq("bundle label set read", p.labels, ["X"]);
    eq("alias text field (content)", p.records[0].text, "hello world");
    eq("{start,end,label} span coerced", p.records[0].label, [[0, 5, "X"]]);
    eq("original field name remembered", p.records[0]._textKey, "content");

    p = NER.parseDataset('[{"id":3,"text":"hi","source":"twitter","meta":{"a":1}}]');
    var plain = NER.toPlain(p.records[0]);
    eq("unknown fields survive a round trip", [plain.source, plain.meta], ["twitter", { a: 1 }]);

    var threw = false;
    try { NER.parseDataset("not json at all"); } catch (e) { threw = true; }
    ok("garbage input throws instead of silently loading nothing", threw);

    G("Span arithmetic");
    var segs = NER.segmentText("San Diego burns", [[0, 9, "GPE"]]);
    eq("segments rejoin to the original text", segs.map(function (s) { return s.text; }).join(""), "San Diego burns");

    var t = "San Diego Sheriff's Office";
    segs = NER.segmentText(t, [[0, 26, "ORG"], [0, 9, "GPE"]]);
    eq("OVERLAP: text reconstructed exactly", segs.map(function (s) { return s.text; }).join(""), t);
    ok("OVERLAP: innermost span takes the color", segs[0].cover[0].label === "GPE");
    ok("OVERLAP: flagged as covered twice", segs[0].cover.length === 2);

    eq("out-of-range span ignored, text intact", NER.segmentText("abc", [[0, 99, "BAD"]]).map(function (s) { return s.text; }).join(""), "abc");
    eq("leading/trailing whitespace trimmed", NER.trimSpan("  San Diego  ", 0, 13), { start: 2, end: 11 });
    eq("whitespace-only selection rejected", NER.trimSpan("   ", 0, 3), null);

    G("Exports");
    var rec = NER.normalizeRecord({ id: 1, text: "Fire near Campo today", label: [[10, 15, "GPE"]] }, 0);
    eq("CoNLL single token", NER.toCoNLL([rec]).split("\n").slice(0, 4), ["Fire O", "near O", "Campo B-GPE", "today O"]);
    var rec2 = NER.normalizeRecord({ id: 1, text: "San Diego Sheriff burns", label: [[0, 17, "ORG"]] }, 0);
    eq("CoNLL multi-token B-/I-", NER.toCoNLL([rec2]).split("\n").slice(0, 4), ["San B-ORG", "Diego I-ORG", "Sheriff I-ORG", "burns O"]);
    var rt = NER.parseDataset(NER.toJSON([rec2]));
    eq("JSON round trip keeps spans", rt.records[0].label, [[0, 17, "ORG"]]);
    var rtl = NER.parseDataset(NER.toJSONL([rec2]));
    eq("JSONL round trip keeps spans", rtl.records[0].label, [[0, 17, "ORG"]]);

    G("Data health checks");
    var iss = NER.datasetIssues([
      NER.normalizeRecord({ id: 1, text: "aa bb", label: [[0, 2, "A"], [1, 4, "B"]] }, 0),
      NER.normalizeRecord({ id: 1, text: "cc", label: [[0, 9, "A"]] }, 1),
      NER.normalizeRecord({ id: 2, text: "dd ee", label: [[2, 5, "A"]] }, 2)
    ]);
    eq("duplicate ids counted", iss.dupIds, 1);
    eq("out-of-range spans counted", iss.badSpans.length, 1);
    eq("overlapping records counted", iss.overlapping, 1);
    eq("untrimmed spans counted", iss.untrimmed, 1);

    // ---------------------------------------------------------------- DOM
    G("Offsets in the live DOM (the bug that broke the old tool)");
    var TEXT = "San Diego officials offered a reward near Campo";
    APP.adoptDataset({ records: [NER.normalizeRecord({ id: 1, text: TEXT, Comments: [], label: [[0, 9, "GPE"]] }, 0)], labels: null }, "test.json");

    eq("rendered text === record text", els.textbox.textContent, TEXT);
    ok("a label chip is rendered", els.textbox.querySelector(".ent[data-chip]") !== null);
    eq("the chip is a ::after pseudo-element, not DOM text", els.textbox.querySelector(".ent").textContent, "San Diego");

    function locate(off) {
      var w = doc.createTreeWalker(els.textbox, win.NodeFilter.SHOW_TEXT, null), seen = 0, n;
      while ((n = w.nextNode())) {
        if (seen + n.textContent.length >= off) return [n, off - seen];
        seen += n.textContent.length;
      }
      return null;
    }
    function select(a, b) {
      var s1 = locate(a), s2 = locate(b);
      var r = doc.createRange();
      r.setStart(s1[0], s1[1]); r.setEnd(s2[0], s2[1]);
      var sel = win.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      return r.toString();
    }

    eq("selection text", select(10, 19), "officials");
    eq("offsets exact AFTER an existing tag", APP.selectionOffsets(els.textbox), { start: 10, end: 19 });

    APP.state.pending = APP.selectionOffsets(els.textbox);
    APP.applyLabel("ORG");
    eq("span stored at true offsets", APP.state.records[0].label, [[0, 9, "GPE"], [10, 19, "ORG"]]);

    eq("selection text after two tags", select(42, 47), "Campo");
    eq("offsets exact AFTER two tags", APP.selectionOffsets(els.textbox), { start: 42, end: 47 });
    APP.state.pending = APP.selectionOffsets(els.textbox);
    APP.applyLabel("GPE");
    eq("third span correct", APP.state.records[0].label[2], [42, 47, "GPE"]);
    eq("all spans slice back to the right words",
      APP.state.records[0].label.map(function (s) { return TEXT.slice(s[0], s[1]); }),
      ["San Diego", "officials", "Campo"]);

    select(6, 19);
    eq("selection crossing a rendered tag", APP.selectionOffsets(els.textbox), { start: 6, end: 19 });

    select(19, 28);   // " offered "
    APP.state.pending = APP.selectionOffsets(els.textbox);
    APP.applyLabel("ORG");
    var added = APP.state.records[0].label.filter(function (s) { return s[0] >= 19 && s[1] <= 28; }).pop();
    eq("sloppy selection trimmed to the word", [added[0], added[1], TEXT.slice(added[0], added[1])], [20, 27, "offered"]);

    G("Editing");
    var before = APP.state.records[0].label.length;
    APP.state.selectedEnt = 0;
    doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Delete", bubbles: true }));
    eq("Delete removes the selected span", APP.state.records[0].label.length, before - 1);
    eq("text still intact after delete", els.textbox.textContent, TEXT);
    doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
    eq("Ctrl+Z restores it", APP.state.records[0].label.length, before);

    APP.state.pending = { start: 0, end: 19 };
    APP.applyLabel("ORG");
    eq("text intact once spans overlap", els.textbox.textContent, TEXT);

    G("Navigation and filtering");
    function mk(n) {
      return { records: Array.from({ length: n }, function (_, i) {
        return NER.normalizeRecord({ id: i + 1, text: "record number " + i, Comments: [], label: i % 2 ? [[0, 6, "GPE"]] : [] }, i);
      }), labels: null };
    }
    APP.adoptDataset(mk(20), "a.json");
    APP.go(1); APP.go(1); APP.go(1);
    eq("moved to record 4", APP.state.pos, 3);
    APP.adoptDataset(mk(12), "b.json");
    eq("a newly opened file starts at record 1", APP.state.pos, 0);
    eq("first record is shown", els.textbox.textContent, "record number 0");

    APP.state.filter.status = "unlabeled";
    APP.computeView();
    eq("unlabeled filter keeps 6 of 12", APP.state.view.length, 6);
    ok("every record in view is unlabeled", APP.state.view.every(function (i) {
      return !APP.state.records[i].label.length;
    }));

    APP.state.filter.status = "labeled";
    APP.computeView();
    eq("labeled filter keeps the other 6", APP.state.view.length, 6);

    APP.state.filter.status = "all";
    APP.state.filter.query = "number 7";
    APP.computeView();
    eq("text search narrows to one record", APP.state.view.length, 1);
    eq("and it is the right one", APP.state.records[APP.state.view[0]].text, "record number 7");

    APP.state.filter.query = "";
    APP.state.filter.label = "GPE";
    APP.computeView();
    eq("label filter keeps only records carrying GPE", APP.state.view.length, 6);

    APP.state.filter = { query: "", status: "all", label: "" };
    APP.computeView();
    eq("clearing filters restores all 12", APP.state.view.length, 12);

    APP.goToAbsolute(4);
    eq("jump to record 5", APP.state.view[APP.state.pos], 4);
    APP.state.pos = 0;
    APP.nextUnlabeled();
    ok("next-unlabeled lands on an unlabeled record",
      !APP.state.records[APP.state.view[APP.state.pos]].label.length);

    G("Real records from tweets_c.json");
    var REAL = [
      { id: 9, text: "Breaking: Fire crews are battling a brush fire burning north of Campo near I-8.", Comments: ["north is loc"], label: [[55, 60, "LOC"], [64, 69, "GPE"], [75, 78, "FAC"]] },
      { id: 24, text: "Madonna’s brother, Christopher Ciccone, has died at 63", Comments: [], label: [[0, 7, "PERSON"], [19, 38, "PERSON"]] },
      { id: 156, text: "The Justice Department is seeking emergency relief from the U.S. Supreme Court in a Texas case involving limited access to the abortion drug #mifepristone.", Comments: [], label: [[0, 22, "ORG"], [60, 78, "ORG"], [84, 89, "GPE"], [141, 154, "HASH"]] },
      { id: 1, text: "Misinformation has spread over the past week in communities hit the hardest.", Comments: [], label: [] }
    ];
    var parsedReal = NER.parseDataset(JSON.stringify(REAL));
    APP.adoptDataset(parsedReal, "tweets_c.json");
    eq("4 real records loaded", APP.state.records.length, 4);
    eq("first real record renders exactly", els.textbox.textContent, REAL[0].text);
    eq("its note is loaded into the box", els.comments.value, "north is loc");
    APP.go(1);
    eq("curly apostrophe does not shift offsets",
      Array.prototype.map.call(els.textbox.querySelectorAll(".ent"), function (e) { return e.textContent; }),
      ["Madonna", "Christopher Ciccone"]);
    eq("duplicate ids in real data are detected", NER.datasetIssues(APP.state.records).dupIds, 0);
    ok("every label in the data is in the palette",
      NER.labelsUsed(APP.state.records).every(function (n) {
        return APP.state.labels.some(function (l) { return l.name === n; });
      }));
    var backReal = NER.parseDataset(NER.toJSON(APP.state.records));
    eq("real data round trip: spans", backReal.records.map(function (r) { return r.label; }), REAL.map(function (r) { return NER.sortSpans(r.label); }));
    eq("real data round trip: text", backReal.records.map(function (r) { return r.text; }), REAL.map(function (r) { return r.text; }));
    eq("real data round trip: Comments", backReal.records.map(function (r) { return r.Comments; }), REAL.map(function (r) { return r.Comments; }));
    var conllReal = NER.toCoNLL([APP.state.records[0]]).split("\n");
    eq("CoNLL on real text", conllReal.filter(function (l) { return /^Campo|^I-8/.test(l); }), ["Campo B-GPE", "I-8. B-FAC"]);

    G("Tag sets");
    var sets = APP.defaultTagSets();
    APP.state.labels = APP.defaultLabels();
    APP.state.tagSets = sets;
    APP.state.activeSet = sets[0].id;
    APP.renderLabels();

    eq("three presets ship by default", sets.map(function (s) { return s.name; }),
      ["Core entities", "Geospatial + social", "Street addresses"]);
    eq("preset 1", APP.tagSet("core").labels, ["GPE", "ORG", "PERSON", "NORP"]);
    eq("preset 2", APP.tagSet("geosoc").labels, ["GPE", "LOC", "FAC", "PERSON", "NORP", "EVENT", "HASH"]);
    eq("preset 3", APP.tagSet("address").labels, ["GPE", "LOC", "FAC", "ADD"]);

    var addDef = APP.state.labels.filter(function (l) { return l.name === "ADD"; })[0];
    ok("ADD is in the catalog", !!addDef);
    ok("ADD's definition carries the address examples", !!addDef && /Jefferson|Main St/.test(addDef.desc), addDef && addDef.desc);

    function quickPickNames() {
      return Array.prototype.map.call(els.quickLabels.querySelectorAll(".lab"), function (b) {
        return b.firstChild.textContent;
      });
    }
    eq("quick picks follow the active set", quickPickNames(), ["GPE", "ORG", "PERSON", "NORP"]);
    APP.state.activeSet = "address"; APP.renderLabels();
    eq("switching the set switches the palette", quickPickNames(), ["GPE", "LOC", "FAC", "ADD"]);
    eq("and the number keys with it", APP.activeLabels().map(function (l) { return l.name; }), ["GPE", "LOC", "FAC", "ADD"]);

    // editing a preset
    APP.state.activeSet = "geosoc";
    APP.addLabel("ADD");
    ok("a catalog label can be added to a preset", APP.tagSet("geosoc").labels.indexOf("ADD") >= 0);
    APP.addLabel("ROAD");
    ok("a brand new label lands in the catalog", APP.state.labels.some(function (l) { return l.name === "ROAD"; }));
    ok("and in the set it was added from", APP.tagSet("geosoc").labels.indexOf("ROAD") >= 0);
    APP.tagSet("geosoc").labels = APP.tagSet("geosoc").labels.filter(function (n) { return n !== "HASH"; });
    APP.renderLabels();
    ok("a label can be taken back out of a preset", APP.tagSet("geosoc").labels.indexOf("HASH") < 0);
    ok("removing it from a set keeps it in the catalog", APP.state.labels.some(function (l) { return l.name === "HASH"; }));

    // a fourth, user-made set
    APP.state.tagSets.push({ id: "mine", name: "My set", labels: ["GPE", "ADD"] });
    APP.state.activeSet = "mine"; APP.renderLabels();
    eq("a fourth set can be created and used", quickPickNames(), ["GPE", "ADD"]);
    eq("four sets now exist", APP.state.tagSets.length, 4);

    // tagging with a label the active set does not contain still renders right
    APP.state.activeSet = "address"; APP.renderLabels();
    eq("a set's label order drives the hotkey order", APP.activeLabels()[3].name, "ADD");

    G("Spans cannot overlap");
    eq("findOverlaps reports every clash", NER.findOverlaps([[0, 5, "A"], [10, 15, "B"]], 3, 12, -1), [0, 1]);
    eq("touching spans do not count as overlapping", NER.findOverlaps([[0, 5, "A"]], 5, 9, -1), []);
    eq("a span may be edited past itself", NER.findOverlaps([[0, 5, "A"]], 0, 8, 0), []);
    eq("resolveOverlaps keeps the longest of a cluster",
      NER.resolveOverlaps([[0, 9, "GPE"], [0, 26, "ORG"], [30, 35, "X"]]), [[0, 26, "ORG"], [30, 35, "X"]]);

    var OT = "San Diego Sheriff's Office arrested a man in Fallbrook";
    APP.adoptDataset({ records: [NER.normalizeRecord({ id: 1, text: OT, Comments: [], label: [] }, 0)], labels: null }, "ov.json");
    APP.state.pending = { start: 0, end: 9 };
    APP.applyLabel("GPE");
    eq("first span added normally", APP.state.records[0].label, [[0, 9, "GPE"]]);

    var realConfirm = win.confirm;
    win.confirm = function () { return false; };
    APP.state.pending = { start: 0, end: 26 };
    APP.applyLabel("ORG");
    eq("declining the overlap prompt changes nothing", APP.state.records[0].label, [[0, 9, "GPE"]]);

    win.confirm = function () { return true; };
    APP.state.pending = { start: 0, end: 26 };
    APP.applyLabel("ORG");
    eq("accepting replaces the span it covered", APP.state.records[0].label, [[0, 26, "ORG"]]);
    win.confirm = realConfirm;

    APP.state.pending = { start: 45, end: 54 };
    APP.applyLabel("GPE");
    eq("a disjoint span is added without a prompt", APP.state.records[0].label, [[0, 26, "ORG"], [45, 54, "GPE"]]);

    var anyOverlap = false;
    var L = APP.state.records[0].label;
    for (var oi = 0; oi < L.length; oi++)
      for (var oj = oi + 1; oj < L.length; oj++)
        if (NER.spansOverlap(L[oi], L[oj])) anyOverlap = true;
    ok("the no-overlap invariant holds", !anyOverlap);

    // the other way in: editing offsets by hand
    APP.renderAll();
    var firstItem = els.entList.querySelectorAll(".ent-item")[0];
    var endInput = firstItem.querySelectorAll('input[type="number"]')[1];
    endInput.value = "50";                       // would run into the 45-54 span
    endInput.dispatchEvent(new win.Event("change"));
    eq("an overlapping hand edit is rejected", APP.state.records[0].label[0], [0, 26, "ORG"]);
    endInput.value = "35";                       // out to "arrested", still disjoint
    endInput.dispatchEvent(new win.Event("change"));
    eq("a non-overlapping hand edit is accepted", APP.state.records[0].label[0], [0, 35, "ORG"]);

    G("Both export shapes survive");
    eq("the export menu still offers spans and BIO",
      Array.prototype.map.call(doc.querySelectorAll("#exportMenu button[data-export]"), function (b) { return b.dataset.export; }),
      ["json", "jsonl", "bundle", "conll", "scheme"]);
    var spanRt = NER.parseDataset(NER.toJSON(APP.state.records));
    eq("span export still round trips", spanRt.records[0].label, NER.sortSpans(APP.state.records[0].label));
    var bio = NER.toCoNLL(APP.state.records).split("\n");
    eq("BIO marks the entity's first token B- and the rest I-", bio.slice(0, 5),
      ["San B-ORG", "Diego I-ORG", "Sheriff's I-ORG", "Office I-ORG", "arrested I-ORG"]);
    eq("BIO starts a new entity at the next span", bio.filter(function (l) { return /^Fallbrook/.test(l); }), ["Fallbrook B-GPE"]);
    eq("BIO marks untagged tokens O", bio.filter(function (l) { return /^man/.test(l); }), ["man O"]);

    G("LOCATION folds into LOC");
    eq("canonicalLabel maps the alias", NER.canonicalLabel("LOCATION"), "LOC");
    eq("and is case-insensitive about it", NER.canonicalLabel("location"), "LOC");
    eq("a real label is left alone", NER.canonicalLabel("GPE"), "GPE");
    ok("LOCATION is not in the default catalog",
      !APP.defaultLabels().some(function (l) { return l.name === "LOCATION"; }));
    ok("nor in any default tag set",
      !APP.defaultTagSets().some(function (s) { return s.labels.indexOf("LOCATION") >= 0; }));

    var aliasParsed = NER.parseDataset('[{"id":1,"text":"fire near Campo tonight","label":[[10,15,"LOCATION"]]}]');
    eq("a LOCATION span is rewritten on load", aliasParsed.records[0].label, [[10, 15, "LOC"]]);
    eq("and the rewrite is reported", aliasParsed.aliased, 1);

    var dupParsed = NER.parseDataset('[{"id":1,"text":"fire near Campo tonight","label":[[10,15,"LOCATION"],[10,15,"LOC"]]}]');
    eq("an alias collapsing onto an identical span is de-duplicated", dupParsed.records[0].label, [[10, 15, "LOC"]]);

    // a stale catalog, as a browser that saw LOCATION earlier would hold
    APP.state.labels = APP.defaultLabels().concat([{ name: "LOCATION", color: "#999999", desc: "stale" }]);
    APP.state.tagSets = APP.defaultTagSets();
    APP.state.tagSets[1].labels.push("LOCATION");
    APP.state.activeSet = APP.state.tagSets[0].id;
    eq("migration reports what it folded away", APP.migrateAliases(), 1);
    ok("LOCATION is gone from the catalog",
      !APP.state.labels.some(function (l) { return l.name === "LOCATION"; }));
    ok("LOCATION is gone from every tag set",
      !APP.state.tagSets.some(function (s) { return s.labels.indexOf("LOCATION") >= 0; }));
    eq("the set it was in keeps its real labels, un-duplicated",
      APP.tagSet("geosoc").labels, ["GPE", "LOC", "FAC", "PERSON", "NORP", "EVENT", "HASH"]);
    eq("LOC keeps its own colour, not the stale entry's",
      APP.state.labels.filter(function (l) { return l.name === "LOC"; })[0].color, "#0891b2");

    APP.state.activeSet = "geosoc";
    APP.addLabel("LOCATION");
    ok("typing LOCATION as a new label yields LOC, not a second class",
      !APP.state.labels.some(function (l) { return l.name === "LOCATION"; }));

    G("Save As");
    ok("the toolbar offers Save As", !!doc.getElementById("btnSaveAs"));
    APP.state.fileName = "tweets_c.json";
    eq("a plain Save keeps the current name", APP.suggestedSaveName(false), "tweets_c.json");
    eq("Save As suggests a copy", APP.suggestedSaveName(true), "tweets_c copy.json");
    APP.state.fileName = "no_extension";
    eq("a name without an extension still gets one", APP.suggestedSaveName(true), "no_extension copy.json");
    APP.state.fileName = "batch.annotated.jsonl";
    eq("only the final extension is treated as one", APP.suggestedSaveName(true), "batch.annotated copy.jsonl");

    G("Clearing labels");
    function threeRecords() {
      return { records: [
        NER.normalizeRecord({ id: 1, text: "fire near Campo", Comments: [], label: [[10, 15, "GPE"]] }, 0),
        NER.normalizeRecord({ id: 2, text: "flood in Fallbrook", Comments: [], label: [[9, 18, "GPE"]] }, 1),
        NER.normalizeRecord({ id: 3, text: "nothing tagged here", Comments: [], label: [] }, 2)
      ], labels: null };
    }
    APP.adoptDataset(threeRecords(), "clear.json");

    APP.clearRecord();
    eq("clearing a record empties just that record", APP.state.records[0].label, []);
    eq("its neighbour is untouched", APP.state.records[1].label, [[9, 18, "GPE"]]);
    doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
    eq("undo brings the record's spans back", APP.state.records[0].label, [[10, 15, "GPE"]]);

    var realConfirm2 = win.confirm;
    win.confirm = function () { return false; };
    APP.clearAllLabels();
    eq("declining the dataset-wide warning changes nothing",
      APP.state.records.map(function (r) { return r.label.length; }), [1, 1, 0]);

    win.confirm = function () { return true; };
    APP.clearAllLabels();
    eq("accepting empties every record",
      APP.state.records.map(function (r) { return r.label.length; }), [0, 0, 0]);
    eq("the text is left completely alone",
      APP.state.records.map(function (r) { return r.text; }),
      ["fire near Campo", "flood in Fallbrook", "nothing tagged here"]);
    win.confirm = realConfirm2;

    doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
    eq("one undo restores the whole dataset",
      APP.state.records.map(function (r) { return r.label; }),
      [[[10, 15, "GPE"]], [[9, 18, "GPE"]], []]);
    doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "z", ctrlKey: true, shiftKey: true, bubbles: true }));
    eq("redo clears it again",
      APP.state.records.map(function (r) { return r.label.length; }), [0, 0, 0]);

    G("Scale");
    var big = [];
    for (var i = 0; i < 7336; i++) {
      var tx = "Fire crews battle a brush fire north of Campo near I-8 tonight " + i;
      big.push(NER.normalizeRecord({ id: i + 1, text: tx, Comments: [], label: [[0, 4, "ORG"], [tx.length - 4, tx.length, "GPE"]] }, i));
    }
    var t0 = win.performance.now();
    APP.adoptDataset({ records: big, labels: null }, "perf.json");
    var loadMs = win.performance.now() - t0;
    ok("7,336 records load and render in under 1s (" + Math.round(loadMs) + "ms)", loadMs < 1000, Math.round(loadMs) + "ms");
    t0 = win.performance.now();
    NER.toJSON(APP.state.records);
    var expMs = win.performance.now() - t0;
    ok("full JSON export under 1s (" + Math.round(expMs) + "ms)", expMs < 1000, Math.round(expMs) + "ms");
    t0 = win.performance.now();
    NER.datasetIssues(APP.state.records);
    var healthMs = win.performance.now() - t0;
    ok("health scan under 1s (" + Math.round(healthMs) + "ms)", healthMs < 1000, Math.round(healthMs) + "ms");
  }
})();
</script>
</body>
</html>
